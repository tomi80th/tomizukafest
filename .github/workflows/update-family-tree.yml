name: Update Tomizuka family tree

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (GitHub may add a few minutes of jitter)
  workflow_dispatch: {}       # manual "refresh now" button
  push:
    branches: [main]          # site edits deploy through here too

concurrency:
  group: tree-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Google Apps Script web-app URL — GET returns responses as CSV (no emails)
      SURVEY_CSV_URL: 'https://script.google.com/macros/s/AKfycbySDN3D1KwLilKY6UTPxc7KcDDij6wzHmeQYr9fndSeOjLvgBc96P5PGOs7sYaomVM/exec'
    steps:
      - uses: actions/checkout@v4

      # Google sometimes answers a runner with a sign-in interstitial instead
      # of the CSV. A merely non-empty file used to be good enough, so those
      # runs rebuilt the tree WITHOUT anyone's survey answers and committed
      # the regression — the tree flip-flopped by ~1200 lines for days.
      # Validate the payload, retry, and fail the run rather than publish a
      # tree that has silently forgotten people.
      - name: Pull live survey responses
        run: |
          if [ -z "$SURVEY_CSV_URL" ]; then
            echo "SURVEY_CSV_URL not set — committed data only."; exit 0
          fi
          for attempt in 1 2 3 4 5; do
            # unique query string per attempt: Google's frontend caches the
            # /exec response by URL and has served runners hours-old
            # snapshots, so the newest responses never reached the build
            bust="$(date +%s)-$RANDOM-$attempt"
            curl -sL --max-time 60 "${SURVEY_CSV_URL}?nocache=${bust}" \
                 -H 'Cache-Control: no-cache' -o /tmp/live_responses.csv || true
            head=$(head -c 22 /tmp/live_responses.csv 2>/dev/null || true)
            rows=$(grep -c "" /tmp/live_responses.csv 2>/dev/null || echo 0)
            if [ "$head" = "timestamp,name,advisor" ] && [ "$rows" -ge 100 ]; then
              echo "live rows: $rows (attempt $attempt)"; exit 0
            fi
            echo "attempt $attempt: bad payload (rows=$rows, head='$head') — retrying"
            rm -f /tmp/live_responses.csv
            sleep $((attempt * 10))
          done
          echo "::error::survey CSV unavailable after 5 attempts; refusing to rebuild without it"
          exit 1

      - name: Rebuild tree data
        working-directory: family-tree
        run: |
          python3 - <<'PY' > /tmp/people_before.txt
          import json, re
          s = open('data/tree.js').read()
          j = json.loads(re.sub(r'^.*?window\.TREE_DATA = ', '', s, flags=re.S).rstrip(';\n'))
          n = 0
          stack = list(j.get('children', []))
          while stack:
              p = stack.pop(); n += 1; stack.extend(p.get('children', []))
          print(n)
          PY
          ARGS="--base data/base.json --survey data/additions.csv --survey data/gen_crawl.csv --survey data/sample_responses.csv"
          if [ -s /tmp/live_responses.csv ]; then
            ARGS="$ARGS --survey /tmp/live_responses.csv"
          fi
          # curator corrections merge LAST so they beat self-reports
          ARGS="$ARGS --survey data/overrides.csv"
          echo "BUILD_ARGS=$ARGS" >> "$GITHUB_ENV"
          python3 scripts/build_data.py $ARGS

      - name: Ingest survey photos (blocklist enforced)
        working-directory: family-tree
        run: |
          pip3 install --quiet pillow
          if [ -s /tmp/live_responses.csv ]; then
            python3 scripts/ingest_photos.py data/overrides.csv /tmp/live_responses.csv data/gen_crawl.csv data/additions.csv
          else
            python3 scripts/ingest_photos.py data/overrides.csv data/gen_crawl.csv data/additions.csv
          fi
          # photo files may have changed -> refresh photo paths in the data
          python3 scripts/build_data.py $BUILD_ARGS

      # last line of defence: people join the tree, they never vanish. A drop
      # means a source failed to load, so stop before the commit.
      - name: Guard against a shrinking tree
        working-directory: family-tree
        run: |
          before=$(cat /tmp/people_before.txt)
          after=$(python3 - <<'PY'
          import json, re
          s = open('data/tree.js').read()
          j = json.loads(re.sub(r'^.*?window\.TREE_DATA = ', '', s, flags=re.S).rstrip(';\n'))
          n = 0
          stack = list(j.get('children', []))
          while stack:
              p = stack.pop(); n += 1; stack.extend(p.get('children', []))
          print(n)
          PY
          )
          echo "people: $before -> $after"
          if [ "$after" -lt $((before - 2)) ]; then
            echo "::error::tree shrank from $before to $after — not committing"
            exit 1
          fi

      - name: Commit if changed
        run: |
          git config user.name "tomi-tree-bot"
          git config user.email "actions@users.noreply.github.com"
          git add family-tree/data/tree.js family-tree/photos
          git add family-tree/data/needs-review.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Auto-update family tree data"
            git push
          fi

      # GITHUB_TOKEN pushes do NOT trigger the branch-based Pages build,
      # so this workflow deploys the whole fest site itself (Pages source:
      # GitHub Actions). Human pushes to main also land here via the push
      # trigger, so normal edits keep deploying exactly as before.
      # configure-pages does not flip an existing site from "deploy from
      # branch" to "GitHub Actions" — set build_type explicitly first.
      - name: Ensure Pages deploys from Actions
        run: |
          curl -sf -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}' \
            && echo "Pages build_type set to workflow" \
            || echo "WARNING could not set build_type (may already be workflow)"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # Pages occasionally answers "Deployment failed, try again later" —
      # one in-run retry rides out the transient
      - name: Retry deploy once
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
